[project]
name = "tutor"
version = "0.1.0"
description = "Daily Italian lessons for absolute beginners with optional Notion export."
requires-python = ">=3.13"

[project.scripts]
italian-lesson = "tutor.daily_lesson:main"
italian-web = "tutor.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tutor"]
